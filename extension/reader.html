<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distill reader</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    @font-face { font-family: 'Distill UI'; font-weight: 500; src: url('assets/fonts/Manrope-500.ttf') format('truetype'); }
    @font-face { font-family: 'Distill UI'; font-weight: 600; src: url('assets/fonts/Manrope-600.ttf') format('truetype'); }
    @font-face { font-family: 'Distill Read'; font-weight: 400; src: url('assets/fonts/Newsreader-400.ttf') format('truetype'); }
    @font-face { font-family: 'Distill Read'; font-weight: 500; src: url('assets/fonts/Newsreader-500.ttf') format('truetype'); }
    body { margin: 0; background: var(--paper-bg); color: var(--ink); font: 500 14px 'Distill UI', system-ui, sans-serif; }
    #status { max-width: 36rem; margin: 20vh auto; padding: 0 16px; text-align: center; color: var(--ink-muted); line-height: 1.5; }
    [hidden] { display: none !important; }
    #toolbar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: center; gap: 4px; padding: 8px; background: var(--paper-bg); border-bottom: 1px solid var(--paper-line); }
    #toolbar button { font: inherit; font-weight: 600; color: var(--ink-muted); background: none; border: 1px solid transparent; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
    #toolbar button[aria-pressed="true"] { color: var(--ink); background: var(--paper); border-color: var(--paper-line); }
    #reading article { max-width: 40rem; margin: 24px auto 64px; padding: 32px clamp(16px, 5vw, 48px); background: var(--paper); border-radius: 8px;
      font: 400 19px/1.65 'Distill Read', Georgia, serif; }
    #reading h1 { font: 500 30px/1.25 'Distill Read', Georgia, serif; margin: 0 0 8px; }
    #reading h2 { font: 600 15px/1.3 'Distill UI', system-ui, sans-serif; color: var(--ink-muted); margin: 40px 0 12px; }
    #reading .byline { font: 500 14px/1.5 'Distill UI', system-ui, sans-serif; color: var(--ink-muted); margin: 0 0 8px; }
    #reading .caption { font-size: 16px; color: var(--ink-muted); }
    #pages { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px; }
    .page { position: relative; background: #fff; box-shadow: 0 1px 4px rgb(0 0 0 / 0.25); --scale-round-x: 1px; --scale-round-y: 1px; }
    .page canvas { display: block; }

    /* Selectable text over the canvas — trimmed from pdf.js web/pdf_viewer.css. */
    .textLayer { position: absolute; inset: 0; overflow: clip; line-height: 1; text-align: initial;
      -webkit-text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; z-index: 0;
      --min-font-size: 1; --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
      --min-font-size-inv: calc(1 / var(--min-font-size)); }
    .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
    .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) {
      z-index: 1; --font-height: 0; font-size: calc(var(--text-scale-factor) * var(--font-height));
      --scale-x: 1; --rotate: 0deg; transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv)); }
    .textLayer .markedContent { display: contents; }
    .textLayer ::selection { background: rgb(0 90 255 / 0.25); }
    .textLayer br::selection { background: transparent; }
    .textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: 0; cursor: default; user-select: none; }
    .textLayer.selecting .endOfContent { top: 0; }
  </style>
  <script src="utils/articleExtractor.js"></script>
  <script src="utils/paperExtractor.js"></script>
  <script src="utils/pdfPaper.js"></script>
  <script src="utils/termMarks.js"></script>
  <script src="utils/readAlong.js"></script>
  <script src="readAlong.js"></script>
  <script type="module" src="reader.js"></script>
</head>
<body>
  <nav id="toolbar" aria-label="View" hidden>
    <button type="button" aria-pressed="true">Reading view</button>
    <button type="button" aria-pressed="false">Original PDF</button>
  </nav>
  <p id="status">Opening paper…</p>
  <div id="reading" hidden></div>
  <main id="pages" aria-label="Paper pages" hidden></main>
</body>
</html>
